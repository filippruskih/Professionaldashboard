name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - run: npm ci

      - run: npm run lint

      # next build already runs a full TypeScript check internally, using
      # the ambient types (e.g. LayoutProps) it generates as part of the
      # same build — a standalone `tsc --noEmit` here would run *before*
      # those types exist on a clean checkout and fail on a false
      # positive, so this is the only type-check step.
      - run: npm run build
